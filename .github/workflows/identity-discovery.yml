name: "Weekly Identity Infrastructure Discovery"

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 02:00 AM UTC
  workflow_dispatch:

jobs:
  discover-identity:
    name: "Discover Active Directory, DNS, DHCP & SCCM"
    runs-on: [self-hosted, windows, 172.23.50.62]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Execute Identity Discovery Task"
        run: |
          python scripts/run_discovery.py --task identity

      - name: "Commit & Push Documentation Updates"
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Weekly Infrastructure Discovery: Active Directory, DNS & DHCP Sync"
          branch: main
