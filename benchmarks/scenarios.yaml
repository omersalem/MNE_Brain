# Benchmark Scenarios Definition
# benchmarks/scenarios.yaml

scenarios:
  - id: "scen-01-dns-mismatch"
    name: "DNS resolution mismatch"
    question: "Why does autodiscover.mne.gov.ps resolve to wrong IP?"
    expected_route: "troubleshooting"
    requires_entity: true
    target_entity: "MNE-DNS-ZONE-GOV"
    permitted_sources: ["canonical_note", "live_adapter"]
    expected_confidence_ceiling: "Medium"
    best_next_check: "Get-DnsServerZone"
    correct_stop_condition: "Zone record verified"

  - id: "scen-02-fortigate-policy"
    name: "FortiGate policy lookup"
    question: "Check FortiGate HQ policy for SSL-VPN access"
    expected_route: "health_check"
    requires_entity: true
    target_entity: "fw-fortigate-hq-01"
    permitted_sources: ["canonical_note", "live_adapter"]
    expected_confidence_ceiling: "High"
    best_next_check: "show_firewall_policy"
    correct_stop_condition: "Policy hit count returned"

