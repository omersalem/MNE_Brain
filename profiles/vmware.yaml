name: "VMware vSphere Discovery Profile"
platform: "vmware"
vendor: "VMware"
purpose: "Read-only discovery of vCenter ESXi hosts, clusters, datastores, and guest VMs."
discovery_frequency: "Daily @ 03:00 AM"
trust_level: "★★★★☆ (Vendor API)"
trust_tier: 4
read_commands:
  - "Get-VMHost"
  - "Get-VM"
  - "Get-Datastore"
read_apis:
  - "GET /rest/vcenter/vm"
  - "GET /rest/vcenter/host"
normalization_rules:
  map_to_schema: "templates/vm.md"
  knowledge_target: "knowledge/20_compute_and_virtualization/21_vcenter_and_hosts/vcenter-main.md"
update_policy:
  auto_promote_to_knowledge: false
  require_verification: true
evidence_sources:
  - "VMware vSphere REST API"
expected_outputs:
  - "Guest VM inventory"
  - "Host CPU/RAM allocation"
  - "Datastore usage"
