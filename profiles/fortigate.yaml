name: "FortiGate Discovery Profile"
platform: "fortigate"
vendor: "Fortinet"
purpose: "Read-only discovery of FortiGate HQ & Branch edge firewalls, policies, and VDOMs."
discovery_frequency: "Daily @ 02:00 AM"
trust_level: "★★★★☆ (Vendor API)"
trust_tier: 4
read_commands:
  - "get system status"
  - "show firewall policy"
  - "get router info routing-table all"
read_apis:
  - "GET /api/v2/cmdb/firewall/policy"
  - "GET /api/v2/monitor/system/status"
normalization_rules:
  map_to_schema: "templates/fortigate.md"
  knowledge_target: "knowledge/10_network_and_security/13_firewalls_and_fmc/fw-fortigate-hq-01.md"
update_policy:
  auto_promote_to_knowledge: false
  require_verification: true
evidence_sources:
  - "FortiOS CLI Telemetry"
  - "Fortinet REST API"
expected_outputs:
  - "Firewall policy inventory"
  - "Interface VLAN bindings"
  - "SD-WAN member status"
