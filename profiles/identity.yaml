name: "Active Directory & DNS Discovery Profile"
platform: "identity"
vendor: "Microsoft"
trust_level: "★★★★☆ (Vendor API)"
trust_tier: 4
purpose: "Read-only discovery of Active Directory DCs, DNS primary zones, and DHCP scopes."
discovery_frequency: "Weekly @ Sunday 02:00 AM"
read_commands:
  - "Get-ADDomainController"
  - "Get-DnsServerZone"
  - "Get-DhcpServerv4Scope"
read_apis:
  - "Active Directory LDAP"
  - "WinRM WMI"
normalization_rules:
  map_to_schema: "templates/server.md"
  knowledge_target: "knowledge/40_identity_and_core_services/41_active_directory/ad-dc-01.md"
update_policy:
  auto_promote_to_knowledge: false
  require_verification: true
evidence_sources:
  - "Active Directory LDAP"
  - "Windows DNS WMI"
expected_outputs:
  - "Domain Controller health"
  - "DNS zone record list"
  - "DHCP lease scopes"
