scenarios:
  - scenario_id: p8-branch-outage
    title: Branch connectivity outage
    family: branch_outage
    symptom_keywords: ["branch down", "unreachable", "internet down", "wan down"]
    primary_bindings: [p7-fortigate-bethlehem, p7-fortigate-hebron, p7-fortigate-hebron-gold, p7-fortigate-jenin, p7-fortigate-jericho, p7-fortigate-nablus, p7-fortigate-nablus-gold, p7-fortigate-qalqilya, p7-fortigate-quds, p7-fortigate-ramallah-gold, p7-fortigate-salfeet, p7-fortigate-tubas, p7-fortigate-tulkarem]
    checks:
      - {binding_id: PRIMARY, check_id: system_status, objective: "Confirm exact firewall identity and authenticated management availability.", read_only: true}
  - scenario_id: p8-vpn-access
    title: Remote access VPN failure
    family: vpn
    symptom_keywords: ["vpn", "remote access", "login failed", "tunnel down"]
    primary_bindings: [p7-fortigate-edge]
    checks:
      - {binding_id: PRIMARY, check_id: system_status, objective: "Confirm edge firewall identity and management availability before session-specific checks.", read_only: true}
  - scenario_id: p8-web-publishing
    title: Published web application unavailable
    family: web_publishing
    symptom_keywords: ["website down", "application unavailable", "http error", "publishing"]
    primary_bindings: [p7-f5, p7-linux-greenunit]
    checks:
      - {binding_id: PRIMARY, check_id: baseline, objective: "Confirm the selected publishing component identity and management availability.", read_only: true}
      - {binding_id: p7-fortigate-edge, check_id: system_status, objective: "Confirm the edge security component is independently reachable.", read_only: true}
  - scenario_id: p8-dns-ad
    title: DNS or Active Directory service issue
    family: dns_ad
    symptom_keywords: ["dns", "active directory", "domain login", "name resolution"]
    primary_bindings: [p7-ad-primary]
    checks:
      - {binding_id: PRIMARY, check_id: identity_services, objective: "Count core identity services and their running state on the exact domain controller.", read_only: true}
      - {binding_id: p7-ad-secondary, check_id: identity_services, objective: "Confirm the secondary domain controller independently with the shared domain credential.", read_only: true}
  - scenario_id: p8-exchange
    title: Exchange mail service issue
    family: exchange
    symptom_keywords: ["email", "exchange", "mail flow", "mailbox"]
    primary_bindings: [p7-exchange-primary]
    checks:
      - {binding_id: PRIMARY, check_id: service_state, objective: "Count Exchange services and their running state on the exact server.", read_only: true}
      - {binding_id: p7-exchange-ps, check_id: organization_state, objective: "Confirm the Exchange organization endpoint and DAG command availability.", read_only: true}
      - {binding_id: p7-ad-primary, check_id: identity_services, objective: "Confirm the supporting identity service baseline independently.", read_only: true}
  - scenario_id: p8-vmware
    title: VMware platform issue
    family: vmware
    symptom_keywords: ["vmware", "vcenter", "virtual machine", "host down"]
    primary_bindings: [p7-vcenter]
    checks:
      - {binding_id: PRIMARY, check_id: appliance_help, objective: "Confirm vCenter appliance identity and management shell availability.", read_only: true}
      - {binding_id: p7-vcenter-rest, check_id: host_inventory, objective: "Confirm pinned REST access to object-level vCenter inventory.", read_only: true}
  - scenario_id: p8-firewall-security
    title: Firewall or managed security path issue
    family: firewall_security
    symptom_keywords: ["blocked", "firewall", "security policy", "traffic denied"]
    primary_bindings: [p7-ftd, p7-fmc, p7-fortigate-edge, p7-sophos]
    checks:
      - {binding_id: PRIMARY, check_id: baseline, objective: "Confirm the selected security component identity and management availability.", read_only: true}
      - {binding_id: p7-fmc-rest, check_id: server_version, objective: "Confirm pinned FMC REST access when it is not already the primary target.", read_only: true}
  - scenario_id: p8-storage-backup-switching
    title: Storage, backup, or switching path issue
    family: storage_backup_switching
    symptom_keywords: ["storage", "backup", "switch", "san"]
    primary_bindings: [p7-fujitsu-sw1, p7-cisco-core, p7-switch-hebron-gold, p7-switch-nablus-gold]
    checks:
      - {binding_id: PRIMARY, check_id: baseline, objective: "Confirm the exact selected infrastructure endpoint identity and availability.", read_only: true}
      - {binding_id: p7-vcenter-rest, check_id: host_inventory, objective: "Confirm the dependent virtualization inventory endpoint independently.", read_only: true}
