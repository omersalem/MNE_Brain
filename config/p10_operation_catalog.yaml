      - <<: *fmc_defaults
        operation_id: p10-fmc-access-rule
        title: FMC access-control rule lifecycle
        operation_type: access_rule
        action_variants: [create_disabled_rule, modify_exact_rule, enable_rule, disable_rule]
        risk_level: 3
        prohibited_conditions: [core_policy, segmentation_change, unrelated_pending_changes]
      - <<: *fmc_defaults
        operation_id: p10-fmc-nat-rule
        title: FMC NAT rule lifecycle
        operation_type: nat_rule
        action_variants: [create_nat_rule, modify_exact_nat_rule, disable_nat_rule]
