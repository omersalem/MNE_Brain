        prohibited_conditions: [snapshot_sprawl, capacity_insufficient, unrelated_pending_changes]
      - <<: *vmware_defaults
        operation_id: p10-vmware-placement
        title: Controlled VM host placement
        operation_type: vm_placement
        action_variants: [place_on_host, migrate_to_host]
        risk_level: 4
        requires_critical_exception: true
        prohibited_conditions: [production_cluster_change, host_capacity_risk, datastore_change, distributed_switch_change, unrelated_pending_changes]

