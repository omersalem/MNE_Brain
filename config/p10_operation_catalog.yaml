        operation_id: p10-windows-exchange
        title: Exchange queue retry and transport operations
        operation_type: exchange
        action_variants: [retry_queue, resume_queue, restart_transport, redirect_exact_message]
        risk_level: 3
        prohibited_conditions: [dag_change, database_change, domain_change, forest_change, unrelated_pending_changes]

