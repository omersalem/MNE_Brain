version: "1.0"
phase: P10
approval_state: OWNER_CONTROLLED
owner_reference: MNE-BRAIN-OWNER

schema_templates:
  common_parameters: &common_parameters
    type: object
    additionalProperties: false
    required: [action, resource_name]
    properties:
      action: {type: string, pattern: "^[a-z][a-z0-9_]{1,63}$"}
      resource_name: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:/@() +,-]{0,127}$"}
      value: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:/@() +,-]{0,255}$"}
      secondary_value: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:/@() +,-]{0,255}$"}
      interface: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,63}$"}
      position: {type: integer, minimum: 1, maximum: 100000}
      size_gb: {type: integer, minimum: 1, maximum: 65536}
      enabled: {type: boolean}
      force: {type: boolean}

families:
  - family_id: fortigate
    title: FortiGate
    operations:
      - &fortigate_defaults
        operation_id: p10-fortigate-address-object
        title: FortiGate address object lifecycle
        platform: fortinet_fortios
        operation_type: address_object
        action_variants: [create_address, update_address, delete_address, create_subnet, create_ip_range, create_fqdn, capture_exact_object]
        template_status: reviewed
        template_version: "1.0.0"
        risk_level: 2
        allowed_bindings: [p7-fortigate-edge, p7-fortigate-bethlehem, p7-fortigate-hebron, p7-fortigate-hebron-gold, p7-fortigate-jenin, p7-fortigate-jericho, p7-fortigate-nablus, p7-fortigate-nablus-gold, p7-fortigate-qalqilya, p7-fortigate-quds, p7-fortigate-ramallah-gold, p7-fortigate-salfeet, p7-fortigate-tubas, p7-fortigate-tulkarem]
        parameter_schema: *common_parameters
        command_renderer: FORTIOS_TYPED_OBJECT_V1
        command_preview: ["Exact canonical FortiOS typed transaction is rendered after validation."]
        pre_checks: [p10_scope_verified, dependency_check, object_conflict_check]
        post_checks: [exact_object_state_verified]
        rollback_strategy: SEPARATE_OWNER_APPROVAL
        rollback_renderer: FORTIOS_EXACT_OBJECT_ROLLBACK_V1
        expected_impact: Only the named FortiGate resource may change.
        prohibited_conditions: [object_conflict, dependency_conflict, unrelated_pending_changes]
        timeout_seconds: 30
        transaction_mode: SINGLE_TYPED_OPERATION
        requires_critical_exception: false
        supports_dry_run: true
        maximum_targets: 1
      - <<: *fortigate_defaults
        operation_id: p10-fortigate-address-group
        title: FortiGate address group lifecycle
        operation_type: address_group
        action_variants: [create_group, update_group]
      - <<: *fortigate_defaults
        operation_id: p10-fortigate-service-catalog
        title: FortiGate services and service groups
        operation_type: service_catalog
        action_variants: [create_service, update_service, create_service_group, update_service_group]
      - <<: *fortigate_defaults
        operation_id: p10-fortigate-nat-objects
        title: FortiGate VIP and IP pool lifecycle
        operation_type: nat_objects
        action_variants: [create_vip, update_vip, create_ip_pool, update_ip_pool]
        pre_checks: [p10_scope_verified, dependency_check, object_conflict_check, backend_reachability_check]
      - <<: *fortigate_defaults
        operation_id: p10-fortigate-policy-lifecycle
        title: FortiGate reviewed policy lifecycle and position
        operation_type: firewall_policy
        action_variants: [create_disabled_policy, modify_exact_fields, enable_policy, disable_policy, position_policy]
        risk_level: 3
        expected_impact: Only the exact reviewed policy and displayed position may change; new policy remains disabled.
        prohibited_conditions: [broad_policy_scope, core_policy, unrelated_policy_reorder, unrelated_pending_changes]
      - <<: *fortigate_defaults
        operation_id: p10-fortigate-static-route
        title: FortiGate static route lifecycle
        operation_type: static_route
        action_variants: [create_route, update_route, delete_route]
        risk_level: 3
        pre_checks: [p10_scope_verified, route_conflict_check, interface_state_check, backend_reachability_check]
        prohibited_conditions: [management_route, default_route, core_route, unrelated_pending_changes]
      - <<: *fortigate_defaults
        operation_id: p10-fortigate-sslvpn
        title: FortiGate SSL-VPN address portal and policy objects
        operation_type: sslvpn_objects
        action_variants: [create_address, update_address, create_portal, update_portal, create_disabled_policy, update_policy]
        risk_level: 3
        prohibited_conditions: [broad_vpn_scope, management_access_risk, core_policy, unrelated_pending_changes]
      - <<: *fortigate_defaults
        operation_id: p10-fortigate-backup-rollback
        title: FortiGate configuration backup and exact-object rollback capture
        operation_type: backup_rollback_capture
        action_variants: [create_backup, capture_exact_object_rollback]
        risk_level: 1
        expected_impact: Creates a bounded backup or in-memory exact-object rollback representation.

  - family_id: f5_bigip
    title: F5 BIG-IP
    operations:
      - &f5_defaults
        operation_id: p10-f5-node
        title: BIG-IP node lifecycle
        platform: f5_bigip
        operation_type: node
        action_variants: [create_node, update_node, delete_node]
        template_status: reviewed
        template_version: "1.0.0"
        risk_level: 2
        allowed_bindings: [p7-f5]
        parameter_schema: *common_parameters
        command_renderer: F5_TYPED_TRANSACTION_V1
        command_preview: ["Exact canonical BIG-IP transaction is rendered after validation."]
        pre_checks: [p10_scope_verified, dependency_check, backend_reachability_check]
        post_checks: [f5_config_verified, exact_object_state_verified]
        rollback_strategy: PLATFORM_ABORT_THEN_SEPARATE_COMMITTED_ROLLBACK
        rollback_renderer: F5_TYPED_ROLLBACK_V1
        expected_impact: Only the named BIG-IP object may change.
        prohibited_conditions: [dependency_conflict, unrelated_pending_changes]
        timeout_seconds: 30
        transaction_mode: PLATFORM_NATIVE_TRANSACTION
        requires_critical_exception: false
        supports_dry_run: true
        maximum_targets: 1
      - <<: *f5_defaults
        operation_id: p10-f5-pool-member
        title: BIG-IP pool and member lifecycle
        operation_type: pool_member
        action_variants: [create_pool, update_pool, add_member, drain_member, disable_member, enable_member]
      - <<: *f5_defaults
        operation_id: p10-f5-health-monitor
        title: BIG-IP health monitor lifecycle
        operation_type: health_monitor
        action_variants: [create_monitor, update_monitor, delete_monitor]
      - <<: *f5_defaults
        operation_id: p10-f5-virtual-server
        title: BIG-IP disabled virtual server lifecycle
        operation_type: virtual_server
        action_variants: [create_disabled_virtual_server, update_virtual_server, delete_virtual_server, enable_virtual_server]
        pre_checks: [p10_scope_verified, backend_reachability_check, pool_health_check, exposure_sequence_check]
        prohibited_conditions: [backend_unreachable, pool_unhealthy, dns_cutover_not_final, unrelated_pending_changes]
      - <<: *f5_defaults
        operation_id: p10-f5-profile
        title: BIG-IP profile lifecycle
        operation_type: profile
        action_variants: [create_profile, update_profile, delete_profile]
      - <<: *f5_defaults
        operation_id: p10-f5-traffic-services
        title: BIG-IP SNAT and persistence
        operation_type: traffic_services
        action_variants: [create_snat, update_snat, create_persistence, update_persistence]
      - <<: *f5_defaults
        operation_id: p10-f5-ssl
        title: BIG-IP SSL profiles and certificates
        operation_type: ssl
        action_variants: [install_certificate, create_ssl_profile, update_ssl_profile]
      - <<: *f5_defaults
        operation_id: p10-f5-waf-attachment
        title: BIG-IP WAF policy attachment
        operation_type: waf_attachment
        action_variants: [attach_waf_policy, detach_waf_policy]
        risk_level: 4
        requires_critical_exception: true
        prohibited_conditions: [waf_policy_unverified, public_exposure_risk, unrelated_pending_changes]
      - <<: *f5_defaults
        operation_id: p10-f5-irule
        title: BIG-IP reviewed iRule lifecycle
        operation_type: irule
        action_variants: [create_reviewed_irule, update_reviewed_irule, attach_reviewed_irule]
        risk_level: 4
        requires_critical_exception: true
        prohibited_conditions: [irule_unreviewed, public_exposure_risk, unrelated_pending_changes]

  - family_id: fmc_ftd
