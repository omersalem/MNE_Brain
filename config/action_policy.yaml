# Controlled Autonomous Remediation Policy
version: "1.0.0"
default_mode: "read_only"
write_operations_allowed: false

risk_levels:
  level_0:
    name: "Read Only"
    impact: "No Impact"
    automatic_allowed: true
    approval_required: "none"
  level_1:
    name: "Low Risk"
    impact: "Minimal Non-Disruptive"
    automatic_allowed: false
    approval_required: "operator"
  level_2:
    name: "Controlled Change"
    impact: "Low Scope Modification"
    automatic_allowed: false
    approval_required: "operator"
  level_3:
    name: "High Impact"
    impact: "Service / Routing / Policy Change"
    automatic_allowed: false
    approval_required: "human_mandatory"
  level_4:
    name: "Emergency Only"
    impact: "Core Infrastructure Impact"
    automatic_allowed: false
    approval_required: "strictly_prohibited"

approved_actions:
  fortigate_add_address_object:
    risk_level: "level_2"
    automatic_allowed: false
    approval_required: "operator"
    allowed_platforms: ["fortigate"]
  fortigate_modify_policy:
    risk_level: "level_3"
    automatic_allowed: false
    approval_required: "human_mandatory"
    allowed_platforms: ["fortigate"]
  cisco_change_interface_description:
    risk_level: "level_1"
    automatic_allowed: false
    approval_required: "operator"
    allowed_platforms: ["cisco"]
  cisco_create_vlan:
    risk_level: "level_2"
    automatic_allowed: false
    approval_required: "operator"
    allowed_platforms: ["cisco"]
  f5_toggle_pool_member:
    risk_level: "level_2"
    automatic_allowed: false
    approval_required: "operator"
    allowed_platforms: ["f5"]
  vmware_power_on_vm:
    risk_level: "level_2"
    automatic_allowed: false
    approval_required: "operator"
    allowed_platforms: ["vmware"]
  exchange_restart_approved_service:
    risk_level: "level_3"
    automatic_allowed: false
    approval_required: "human_mandatory"
    allowed_platforms: ["exchange"]
