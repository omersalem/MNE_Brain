# Controlled Action Policy & Read Allow-Lists
# config/action_policy.yaml

allowed_read_profiles:
  fortigate:
    platform: "fortigate"
    trust_tier: 5
    allowed_checks:
      get_system_status:
        command: "get system status"
        description: "FortiOS version, uptime, and system health"
      get_system_interface_physical:
        command: "get system interface physical"
        description: "Physical interface link status and speed"
      show_firewall_policy:
        command: "show firewall policy"
        description: "Firewall policy configuration and rules"
      get_router_info_routing_table_all:
        command: "get router info routing-table all"
        description: "Full IP routing table"
      get_vpn_ipsec_tunnel_list:
        command: "get vpn ipsec tunnel list"
        description: "IPsec VPN tunnel status"

level_0_read_only_default: true
remediation_write_gate:
  require_human_approval: true
  require_pre_conditions_verified: true
